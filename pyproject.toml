[project]
name = "string-art"
version = "0.1.0"
description = "Recreate images by connecting nails with strings using a greedy algorithm (B/W and RGB)"
authors = [
    { name = "Kaspar Valk" },
    { name = "Kert Tali" },
    { name = "Almas Baktubayev" },
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "numpy>=1.26.1,<2",
    "scikit-image>=0.22,<0.23",
    "matplotlib>=3.8,<4",
]

[project.scripts]
string-art = "string_art.cli:main"

[tool.poetry]
packages = [{ include = "string_art", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.14"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
