[project]
name = "restring"
version = "1.0.0"
description = "Recreate images by connecting nails with strings using a greedy algorithm (B/W and RGB)"
authors = [
    { name = "Kaspar Valk" },
    { name = "Kert Tali" },
    { name = "Almas Baktubayev" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
restring = "restring.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.14",
    "matplotlib>=3.8,<4",
    "numpy>=2.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[build-system]
requires = ["maturin>=1.5"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "restring._core"
