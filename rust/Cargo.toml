[workspace]
members = ["core"]
exclude = ["wasm"]
resolver = "2"

[package]
name = "restring-pyo3"
version = "1.1.0"
edition = "2021"
description = "CPython binding for the ReString core"

[lib]
name = "restring_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py312"] }
restring-core-algo = { path = "core" }

[profile.release]
opt-level = 3
lto = true
