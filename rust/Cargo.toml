[package]
name = "restring-core"
version = "1.1.0"
edition = "2021"
description = "Rust core for the ReString greedy string art algorithm"

[lib]
name = "restring_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py312"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = true
