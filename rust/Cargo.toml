[workspace]
members = ["core"]
exclude = ["wasm"]
resolver = "2"

[package]
name = "restring-pyo3"
version = "2.0.1"
edition = "2021"
description = "CPython binding for the ReString core"

[lib]
name = "restring_core"
crate-type = ["cdylib"]

[dependencies]
# extension-module: resolve Python symbols at runtime, so the manylinux
# wheel builds never link against libpython
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
restring-core-algo = { path = "core" }

[profile.release]
opt-level = 3
lto = true
