[package]
name = "restring-wasm"
version = "1.1.0"
edition = "2021"
description = "wasm binding for the ReString core (browser playground)"

[lib]
name = "restring_wasm"
crate-type = ["cdylib"]

[dependencies]
restring-core-algo = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
wasm-bindgen = "0.2"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O2"]
