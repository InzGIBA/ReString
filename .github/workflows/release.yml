# Release: build wheels for three platforms on a v* tag, publish to PyPI via
# trusted publishing and create the GitHub Release.
#
# One-time setup on pypi.org: register this repository as a trusted publisher
# for the "restring" project (workflow release.yml, job publish, environment
# pypi). For a dry run, register a second trusted publisher on test.pypi.org
# and dispatch this workflow with the testpypi input set to true, then verify:
#   pip install --index-url https://test.pypi.org/simple restring
# in clean 3.12, 3.13 and 3.14 virtualenvs. musllinux wheels are not built.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to test.pypi.org instead of PyPI (dry run)"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test before publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # same pipeline as ci.yml: never publish an untested tag
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - uses: astral-sh/setup-uv@v5

      - run: uv sync
      - run: uv run ruff check .
      - run: uv run python scripts/check_version_sync.py
      - run: uv run pytest

  build:
    name: build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # linux builds run inside the manylinux container maturin provides;
          # aarch64 cross-compiles on the x86_64 runner
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # PyPI sanitizes the description: no <picture>, no SVG, no relative
      # paths. The repo README keeps the GitHub rendering.
      - name: Make the long description PyPI-safe
        shell: bash
        run: python3 scripts/build_pypi_readme.py README.md README.md || python scripts/build_pypi_readme.py README.md README.md

      # abi3-py312: one wheel per platform covers CPython 3.12 and newer
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.target }}
          path: dist

  sdist:
    name: build (sdist)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Make the long description PyPI-safe
        run: python3 scripts/build_pypi_readme.py README.md README.md
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  publish:
    name: publish
    needs: [build, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # trusted publishing exchanges this OIDC token for a PyPI upload
      id-token: write
      # the GitHub Release creation below
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to test.pypi.org (dry run)
        if: ${{ inputs.testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/p/

      - name: Publish to PyPI
        if: ${{ !inputs.testpypi }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create the GitHub Release
        if: ${{ !inputs.testpypi }}
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
